<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            margin: 0 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <div id="errorMessage" class="error"></div>
            <div class="button-group">
                <button type="submit" id="userLogin">Login as User</button>
                <button type="button" id="adminLogin">Login as Admin</button>
            </div>
        </form>
    </div>

    <script>
        function validateAndLogin(loginType) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.textContent = '';
            
            // Basic validation
            if (!username) {
                errorMessage.textContent = 'Username is required.';
                return false;
            }
            if (!password) {
                errorMessage.textContent = 'Password is required.';
                return false;
            }
            
            // Simulate login success (in a real app, verify credentials via backend)
            alert(`Login successful as ${loginType}!`);
            
            // Redirect based on login type
            if (loginType === 'admin') {
                window.location.href = 'admin-dashboard.html'; // Redirect to admin page
            } else {
                window.location.href = 'issue-tracking.html'; // Redirect to user tracking page
            }
            return true;
        }

        document.getElementById('userLogin').addEventListener('click', function() {
            validateAndLogin('user');
        });

        document.getElementById('adminLogin').addEventListener('click', function() {
            validateAndLogin('admin');
        });
    </script>
</body>
</html>
